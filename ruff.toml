# Ruff configuration for audio-tools.
#
# This lives in ruff.toml rather than pyproject.toml on purpose. The tools here
# are standalone PEP 723 scripts run through `uv run --script`, not an
# installable package, and a pyproject.toml would imply one that does not exist.

target-version = "py310"  # Matches `requires-python = ">=3.10"` in each script's PEP 723 block.
line-length = 88

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
  "BLE", # flake8-blind-except
]

ignore = [
  # Spectral-domain variables (A, B, H, Sa, Sr, T) match the notation used in
  # the tool READMEs, where the transfer function is written `H = B/A`.
  # Lowercasing them would break the correspondence between code and docs.
  "N806",
]

[format]
quote-style = "double"
indent-style = "space"
