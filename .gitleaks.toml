[extend]
# Use the default gitleaks rules as a base.
useDefault = true

[allowlist]
# There are no vendored dependencies, and no Python lockfile: each tool
# declares its own dependencies inline via PEP 723. The one lockfile present,
# package-lock.json, pins the text linters and is scanned like any other file,
# so the usual lockfile exclusions are not set up here.
#
# The probe WAVs are committed build artifacts, reproducible from maketest.py.
# They are 32-bit float audio, so high-entropy byte runs are expected and mean
# nothing; excluding them avoids false positives on that entropy.
paths = ['''tools/sampler-nulltest/probe/.*\.wav''']
