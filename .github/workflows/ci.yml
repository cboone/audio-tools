name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".claude/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Ruff lint
        run: uvx ruff@0.16.5 check .

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Ruff format
        run: uvx ruff@0.16.5 format --check .

  github-lint:
    name: Actionlint
    uses: cboone/gh-actions/.github/workflows/lint-github-actions.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0

  test-scrut:
    # Every tool is a `uv run --script` shebang, so uv has to be on PATH before
    # scrut runs anything.
    #
    # pipx rather than `pip install --user`: the runner's system Python is
    # externally managed (PEP 668), so a plain --user install errors out. pipx
    # is preinstalled on the GitHub images and exists for exactly this.
    #
    # pipx rather than the upstream `curl | sh` installer: the version stays
    # pinned and explicit instead of tracking whatever astral.sh serves today.
    #
    # $GITHUB_PATH persists across steps within the job, so the scrut step
    # further down finds uv.
    uses: cboone/gh-actions/.github/workflows/run-scrut-tests.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0
    with:
      scrut-test-dir: "tests/scrut/"
      scrut-setup-cmd: >-
        pipx install 'uv==0.12.7' && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      scrut-env: |
        NULLTEST_BIN=./tools/sampler-nulltest/nulltest.py
        MAKETEST_BIN=./tools/sampler-nulltest/maketest.py
        MAKETONES_BIN=./tools/test-signals/maketones.py
